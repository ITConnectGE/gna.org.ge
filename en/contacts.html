    <script>
        (function () {
            const canvas = document.getElementById('neuralCanvas');
            const section = document.getElementById('body');
            if (!canvas || !section) return;
            const ctx = canvas.getContext('2d');
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let width = 0, height = 0, dpr = window.devicePixelRatio || 1;
            const particles = [];
            const mouse = { x: null, y: null, active: false };
            const CONFIG = { count: 90, maxDistance: 140, mouseRadius: 200, attractionStrength: 0.006, baseSpeed: 0.4 };

            function resize() {
                const rect = section.getBoundingClientRect();
                width = rect.width; height = rect.height;
                canvas.width = width * dpr; canvas.height = height * dpr;
                canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            function init() {
                particles.length = 0;
                const count = width < 600 ? Math.floor(CONFIG.count * 0.55) : CONFIG.count;
                for (let i = 0; i < count; i++) {
                    particles.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - 0.5) * CONFIG.baseSpeed, vy: (Math.random() - 0.5) * CONFIG.baseSpeed, radius: Math.random() * 1.8 + 1.2, pulse: Math.random() * Math.PI * 2 });
                }
            }
            function update() {
                for (const p of particles) {
                    p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
                    if (p.x < 0) { p.x = 0; p.vx *= -1; }
                    if (p.x > width) { p.x = width; p.vx *= -1; }
                    if (p.y < 0) { p.y = 0; p.vy *= -1; }
                    if (p.y > height) { p.y = height; p.vy *= -1; }
                    if (mouse.active) {
                        const dx = mouse.x - p.x, dy = mouse.y - p.y, dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.mouseRadius && dist > 0) {
                            const pull = (1 - dist / CONFIG.mouseRadius) * CONFIG.attractionStrength;
                            p.vx += dx * pull; p.vy += dy * pull;
                        }
                    }
                    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                    if (speed > 1.4) { p.vx = (p.vx / speed) * 1.4; p.vy = (p.vy / speed) * 1.4; }
                    p.vx *= 0.995; p.vy *= 0.995;
                    if (Math.abs(p.vx) < 0.1) p.vx += (Math.random() - 0.5) * 0.02;
                    if (Math.abs(p.vy) < 0.1) p.vy += (Math.random() - 0.5) * 0.02;
                }
            }
            function draw() {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.maxDistance) {
                            ctx.strokeStyle = `rgba(255,255,255,${(1 - dist / CONFIG.maxDistance) * 0.35})`;
                            ctx.lineWidth = 0.7;
                            ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                        }
                    }
                }
                if (mouse.active) {
                    for (const p of particles) {
                        const dx = p.x - mouse.x, dy = p.y - mouse.y, dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.mouseRadius) {
                            ctx.strokeStyle = `rgba(255,255,255,${(1 - dist / CONFIG.mouseRadius) * 0.9})`;
                            ctx.lineWidth = 1.1;
                            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
                        }
                    }
                    const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 60);
                    grad.addColorStop(0, 'rgba(255,255,255,0.35)'); grad.addColorStop(0.5, 'rgba(255,255,255,0.08)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 60, 0, Math.PI * 2); ctx.fill();
                }
                for (const p of particles) {
                    const pulseR = p.radius + Math.sin(p.pulse) * 0.3;
                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.beginPath(); ctx.arc(p.x, p.y, pulseR, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.beginPath(); ctx.arc(p.x, p.y, pulseR * 2.2, 0, Math.PI * 2); ctx.fill();
                }
            }
            function loop() { update(); draw(); requestAnimationFrame(loop); }
            let resizeTimer;
            window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { resize(); init(); }, 150); });
            section.addEventListener('mousemove', e => { const rect = section.getBoundingClientRect(); mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top; mouse.active = true; });
            section.addEventListener('mouseleave', () => { mouse.active = false; });
            resize(); init(); if (!prefersReducedMotion) loop(); else draw();
        })();
    </script>
